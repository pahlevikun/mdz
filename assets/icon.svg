<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="mdz icon">
  <!-- canvas: #0f1115, page: #2b2f38, border: #565f6b, accent: #6ba3ff -->
  <!-- contrast: page/tile 1.41:1, border/page 2.07:1, hash/page 5.3:1 -->
  <g transform="translate(48 48) scale(3.0588235294117645)">
    <rect x="0" y="0" width="136" height="136" rx="30" fill="#0f1115"/>

    <!-- page: one step up from the tile, edge strong enough to survive 32px -->
    <path d="M 40 12 H 82 L 104 34 V 116 A 8 8 0 0 1 96 124 H 40 A 8 8 0 0 1 32 116 V 20 A 8 8 0 0 1 40 12 Z"
          fill="#2b2f38" stroke="#6e7681" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 82 12 V 30 A 4 4 0 0 0 86 34 H 104 Z"
          fill="#22262e" stroke="#6e7681" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- one hash: rounded terminals, even counters -->
    <g stroke="#6ba3ff" stroke-width="8" stroke-linecap="round">
      <line x1="58" y1="53" x2="58" y2="95"/>
      <line x1="77" y1="53" x2="77" y2="95"/>
      <line x1="49" y1="65" x2="86" y2="65"/>
      <line x1="49" y1="83" x2="86" y2="83"/>
    </g>
  </g>
</svg>
