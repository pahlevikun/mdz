    <rect x="42" y="46" width="70" height="5" rx="2.5" fill="#9aa0a6"/>
    <rect x="42" y="56" width="56" height="5" rx="2.5" fill="#9aa0a6"/>
    <g>
      <rect x="42" y="68" width="4" height="14" rx="1.5" fill="#2f6feb"/>
      <rect x="54" y="68" width="4" height="14" rx="1.5" fill="#2f6feb"/>
      <rect x="40" y="72" width="20" height="3" rx="1.5" fill="#2f6feb"/>
