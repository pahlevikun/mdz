    <rect x="42" y="90" width="12" height="4" rx="2" fill="#2f6feb"/>
    <rect x="58" y="88" width="48" height="5" rx="2.5" fill="#9aa0a6"/>
  </g>

  <text x="184" y="132" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="700" letter-spacing="-0.02em" fill="#e6e8eb">mdz</text>

  <text x="184" y="182" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#9aa0a6">any page to LLM-ready markdown</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="500">
    <rect x="184" y="196" width="52" height="28" rx="999" fill="#252830" stroke="#3a3f47" stroke-width="1"/>
